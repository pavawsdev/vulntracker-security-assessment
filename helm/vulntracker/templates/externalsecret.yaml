{{- if .Values.externalSecrets.enabled }}
# External Secrets Operator pulls values from the secrets manager into a Secret at runtime;
# the chart only holds references, never values
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "vulntracker.fullname" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ include "vulntracker.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .remoteKey }}
        property: {{ .property }}
    {{- end }}
{{- end }}
