{{- if .Values.serviceAccount.create }}
# Dedicated identity with no RBAC bindings and no auto-mounted API token
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vulntracker.serviceAccountName" . }}
  namespace: {{ include "vulntracker.namespace" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
