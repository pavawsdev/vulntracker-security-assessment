name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  # Security scanning. Tool choices are documented in docs/findings.md. The SAST,
  # SCA and IaC jobs gate the build; accepted residual CVEs are listed in
  # .trivyignore (see docs/remediation-plan.md) so the gate catches NEW issues.

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@v4
      - name: Run SAST (fails on any finding)
        run: |
          semgrep scan --config p/python --config p/javascript \
            --config p/secrets --config p/jwt --config p/owasp-top-ten \
            --error --metrics off --json --output sast.semgrep.json app notify/src
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast.semgrep.json
          path: sast.semgrep.json

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.75.0
      - name: Generate SCA report
        if: always()
        run: trivy fs --scanners vuln --format json --output sca.trivy.json --skip-dirs node_modules --skip-dirs .venv .
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca.trivy.json
          path: sca.trivy.json
      - name: Gate on new critical/high CVEs (.trivyignore holds accepted ones)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false --exit-code 1 --skip-dirs node_modules --skip-dirs .venv .

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vulntracker-api:ci .
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.75.0
      - name: Scan image (report only)
        run: trivy image --scanners vuln,secret,misconfig --format json --output container.trivy.json vulntracker-api:ci
      - name: Upload container report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: container.trivy.json

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install Checkov
        run: pip install checkov==3.3.9
      - name: Scan Helm chart
        run: |
          echo 'publicBaseUrl: https://vulntracker.example.com' > /tmp/iac-values.yaml
          checkov -d helm/vulntracker --framework helm --var-file /tmp/iac-values.yaml \
            -o json --quiet > iac.checkov.json
      - name: Upload IaC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac.checkov.json
          path: iac.checkov.json
